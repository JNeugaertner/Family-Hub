# Baut das Docker-Image (Dockerfile) bei Änderungen als Probe, ohne es zu veröffentlichen.
# Bei einem Versions-Tag (v1.2.3) wird es zusätzlich auf ghcr.io veröffentlicht, für PCs und Server (amd64) und
# für Raspberry Pi und viele NAS (arm64). Beim ersten Mal das Paket auf GitHub unter "Packages" öffentlich stellen.
name: Docker-Image

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - Dockerfile
      - .dockerignore
      - pom.xml
      - .mvn/**
      - src/main/**
      - frontend/**
      - .github/workflows/docker-image.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pom.xml
      - .mvn/**
      - src/main/**
      - frontend/**
      - .github/workflows/docker-image.yml

permissions:
  contents: read
  packages: write

env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Nur für das arm64-Image nötig: Der letzte Schritt im Dockerfile läuft dann emuliert
      - uses: docker/setup-qemu-action@v4
        if: env.RELEASE == 'true'

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.RELEASE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags des Images: v0.7.0 ergibt 0.7.0, 0.7 und latest
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.RELEASE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
