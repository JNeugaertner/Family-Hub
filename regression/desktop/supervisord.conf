[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1440x1000x24 -ac
priority=10
autorestart=true

[program:fluxbox]
command=/bin/sh -c 'until xdpyinfo -display :99 >/dev/null 2>&1; do sleep 1; done; exec fluxbox -rc /tests/desktop/fluxbox-init'
priority=20
autorestart=true

[program:vnc]
command=/bin/sh -c 'sleep 2; exec x11vnc -display :99 -forever -shared -nopw -listen 127.0.0.1 -rfbport 5900'
priority=30
autorestart=true

[program:web]
command=/usr/bin/websockify --web=/opt/desktop 6080 127.0.0.1:5900
priority=40
autorestart=true

[program:terminal]
command=/bin/sh -c 'sleep 3; exec xterm -geometry 110x22+10+640 -title "FamilyHub Regression - npm test" -e /tests/desktop/run-tests.sh'
priority=50
autorestart=true
