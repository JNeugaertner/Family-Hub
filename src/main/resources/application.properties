spring.application.name=FamilyHub

# Lokale MongoDB (scripts/start-mongodb.ps1), Standard-Host localhost:27017
spring.mongodb.database=familyhub
# Legt u. a. den eindeutigen Index auf den Benutzernamen an
spring.data.mongodb.auto-index-creation=true

# Legt beim Start mit leerer Datenbank die Beispielfamilie aus dem Figma-UI an (mit Beispiel-Passwort!)
familyhub.sample-data.enabled=true

# Kind wird ab diesem Alter automatisch Jugendlicher (Entscheidung vom 22.09.2026)
familyhub.roles.teen-age=13

# Frontend (Vite-Dev-Server), das die API aus dem Browser aufrufen darf; mehrere Werte mit Komma trennen
familyhub.cors.allowed-origins=http://localhost:5173

# Anmelde-Sitzung
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax
# So viele falsche Passwörter innerhalb der Sperrdauer sperren ein Konto für die Sperrdauer
familyhub.login.max-failures=5
familyhub.login.lock-duration=PT5M

# Müllabfuhr: Wann täglich die Aufgaben für die Abholungen der nächsten 7 Tage angelegt werden
# (Sekunde Minute Stunde Tag Monat Wochentag; Entscheidung vom 20.10.2026: 07:50 Uhr)
familyhub.waste.task-sync-cron=0 50 7 * * *

# Google Kalender (nur lesen). Zugangsdaten NIE hier eintragen (Repo ist öffentlich), sondern in local.properties
# im Projektordner (steht in .gitignore, siehe README): familyhub.google.client-id, familyhub.google.client-secret,
# familyhub.google.token-key. Ohne sie ist die Anbindung "nicht eingerichtet".
spring.config.import=optional:file:./local.properties
familyhub.google.redirect-uri=http://localhost:8080/api/google/callback
familyhub.google.frontend-url=http://localhost:5173
familyhub.google.sync-interval=PT15M
# So oft wird geprüft, ob geänderte FamilyHub-Termine in die Google-Kalender „FamilyHub“ einzutragen sind
familyhub.google.push-delay=PT10S

# Wetter (OpenWeather). Den API-Schlüssel NIE hier eintragen, sondern in local.properties:
# familyhub.weather.api-key. Ohne ihn ist das Wetter "nicht eingerichtet".
familyhub.weather.cache-duration=PT10M

# WhatsApp Cloud API (Meta). Eingehende Nachrichten kommen per Webhook auf /api/whatsapp und werden roh
# gespeichert (noch keine KI-Auswertung, keine automatischen Antworten). Die Zugangsdaten NIE hier eintragen
# (Repo ist öffentlich): Sie kommen aus den Umgebungsvariablen unten oder aus local.properties
# (familyhub.whatsapp.access-token, .phone-number-id, .verify-token, .app-secret); local.properties gewinnt.
# Der Verify-Token ist ein frei gewählter Wert, der bei Meta und hier identisch sein muss. Siehe README.
familyhub.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
familyhub.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
familyhub.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
familyhub.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}

# Telegram-Bot der Familie (Nachrichten empfangen und senden). Den Bot-Token von @BotFather NIE hier eintragen,
# sondern als Umgebungsvariable TELEGRAM_BOT_TOKEN oder in local.properties (familyhub.telegram.bot-token).
# FamilyHub holt die Nachrichten selbst bei Telegram ab und braucht dafür keine öffentliche Adresse. Siehe README.
familyhub.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}

# Benachrichtigungen über Telegram (siehe README): dringende Aufgaben morgens am Fälligkeitstag, kurzfristige Termine
# (Beginn innerhalb von short-notice), Bestätigungen, die länger als pending-after offen sind (Abgleich alle pending-scan)
familyhub.notifications.due-reminder-cron=0 0 7 * * *
familyhub.notifications.short-notice=PT24H
familyhub.notifications.pending-after=PT24H
familyhub.notifications.pending-scan=PT15M

# KI-Assistent über Groq (in Arbeit, siehe README). Den API-Schlüssel NIE hier eintragen, sondern als
# Umgebungsvariable GROQ_API_KEY oder in local.properties (familyhub.assistant.api-key).
familyhub.assistant.api-key=${GROQ_API_KEY:}
# Modell bei Groq; muss Werkzeug-Aufrufe (Tool Use) können. Aktuelle Liste: https://console.groq.com/docs/models
familyhub.assistant.model=openai/gpt-oss-120b

# Swagger UI: CSRF-Token automatisch mitsenden (Login und Logout beschreibt OpenApiConfig)
springdoc.swagger-ui.csrf.enabled=true
