spring.application.name=FamilyHub

# Lokale MongoDB (scripts/start-mongodb.ps1), Standard-Host localhost:27017
spring.mongodb.database=familyhub
# Legt u. a. den eindeutigen Index auf den Benutzernamen an
spring.data.mongodb.auto-index-creation=true

# Legt beim Start mit leerer Datenbank die Beispielfamilie aus dem Figma-UI an (mit Beispiel-Passwort!)
familyhub.sample-data.enabled=true

# Kind wird ab diesem Alter automatisch Jugendlicher (Entscheidung vom 22.09.2026)
familyhub.roles.teen-age=13

# Frontend (Vite-Dev-Server), das die API aus dem Browser aufrufen darf; mehrere Werte mit Komma trennen
familyhub.cors.allowed-origins=http://localhost:5173

# Anmelde-Sitzung
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax

# Swagger UI: Login-Endpunkt anzeigen und CSRF-Token automatisch mitsenden
springdoc.show-login-endpoint=true
springdoc.swagger-ui.csrf.enabled=true
