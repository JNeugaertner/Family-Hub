# Ergaenzt src/main/resources/application.properties nur fuer Tests.
# Tests nutzen eine eingebettete MongoDB (Flapdoodle), keine lokale Installation.
# Beim ersten Testlauf wird diese Version einmalig heruntergeladen (~800 MB, Cache in ~/.embedmongo).
# 8.0.23 ist die neueste 8.0-Version, die Flapdoodle 4.33 kennt.
de.flapdoodle.mongodb.embedded.version=8.0.23

familyhub.sample-data.enabled=false
# Erfolge-Katalog nicht automatisch anlegen: Bonuspunkte würden sonst Punktestände in anderen Tests verändern.
# AchievementTest legt seinen Katalog selbst an.
familyhub.achievements.default-catalog=false

# Feste Test-Zugangsdaten, damit Tests nie echte Werte aus local.properties nutzen und Google nie aufrufen
familyhub.google.client-id=test-client-id
familyhub.google.client-secret=test-client-secret
familyhub.google.token-key=test-token-key
# Automatischer Abgleich soll in Tests nie anlaufen
familyhub.google.sync-interval=P1D
