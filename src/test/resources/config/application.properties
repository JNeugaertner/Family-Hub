# Ergaenzt src/main/resources/application.properties nur fuer Tests.
# Tests nutzen eine eingebettete MongoDB (Flapdoodle), keine lokale Installation.
# Beim ersten Testlauf wird diese Version einmalig heruntergeladen (~800 MB, Cache in ~/.embedmongo).
# 8.0.23 ist die neueste 8.0-Version, die Flapdoodle 4.33 kennt.
de.flapdoodle.mongodb.embedded.version=8.0.23

familyhub.sample-data.enabled=false
# Erfolge-Katalog nicht automatisch anlegen: Bonuspunkte würden sonst Punktestände in anderen Tests verändern.
# AchievementTest legt seinen Katalog selbst an.
familyhub.achievements.default-catalog=false

# Feste Test-Zugangsdaten, damit Tests nie echte Werte aus local.properties nutzen und Google nie aufrufen
familyhub.google.client-id=test-client-id
familyhub.google.client-secret=test-client-secret
familyhub.google.token-key=test-token-key
# Automatischer Abgleich und automatisches Eintragen sollen in Tests nie anlaufen
familyhub.google.sync-interval=P1D
familyhub.google.push-delay=P1D

# Fester Test-Schlüssel und eine Adresse, die nie antwortet: Tests simulieren OpenWeather
familyhub.weather.api-key=test-weather-key
familyhub.weather.base-url=http://openweather.invalid

# Feste WhatsApp-Werte: Tests nutzen nie echte Umgebungsvariablen und rufen Meta nie auf.
# Der Basis-URL zeigt auf eine Adresse, die nie antwortet (siehe MockRestServiceServer in den Tests).
familyhub.whatsapp.access-token=test-access-token
familyhub.whatsapp.phone-number-id=test-phone-number-id
familyhub.whatsapp.verify-token=test-verify-token
familyhub.whatsapp.app-secret=test-app-secret
familyhub.whatsapp.api-base-url=https://graph.invalid

# Fester Telegram-Token und eine Adresse, die nie antwortet; abgeholt wird in Tests nur von Hand (TelegramPoller)
familyhub.telegram.bot-token=test-bot-token
familyhub.telegram.polling=false
familyhub.telegram.api-url=https://telegram.invalid

# Benachrichtigungen sofort senden (prüfbar) und die Erinnerungen nur von Hand auslösen ("-" schaltet den Cron ab)
familyhub.notifications.async=false
familyhub.notifications.due-reminder-cron=-
familyhub.notifications.pending-scan=P1D

# Fester KI-Schlüssel und eine Adresse, die nie antwortet: Tests simulieren das Sprachmodell (FakeLanguageModel)
familyhub.assistant.api-key=test-groq-key
familyhub.assistant.base-url=https://groq.invalid/openai/v1
familyhub.assistant.model=test-model
