# MongoDB für die lokale Entwicklung per Docker (Alternative zu scripts/start-mongodb.ps1 bzw. .sh).
# Bewusst nicht docker-compose.yml: Sonst startete ein "docker compose up -d" im Projektordner diese Datenbank
# statt FamilyHub (das liegt in deploy/), und das auch noch auf demselben Port wie eine selbst gestartete MongoDB.
# Starten: docker compose -f compose.dev-mongodb.yaml up -d   ·   Beenden: docker compose -f compose.dev-mongodb.yaml down
# (Daten bleiben im Volume mongodb_data)
# Wie das Skript: ohne Benutzer und Passwort, aber nur vom eigenen Rechner aus erreichbar (127.0.0.1).
# FamilyHub komplett (Oberfläche, Backend und MongoDB mit Passwort) per Docker: siehe deploy/compose.yaml.
services:
  mongodb:
    image: mongo:8.0
    container_name: familyhub-mongodb

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongodb_data:/data/db

    restart: unless-stopped

volumes:
  mongodb_data:
