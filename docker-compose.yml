# MongoDB für die lokale Entwicklung per Docker (Alternative zu scripts/start-mongodb.ps1).
# Starten: docker compose up -d   ·   Beenden: docker compose down   (Daten bleiben im Volume mongodb_data)
# Wie das Skript: ohne Benutzer und Passwort, aber nur vom eigenen Rechner aus erreichbar (127.0.0.1).
services:
  mongodb:
    image: mongo:8.0
    container_name: familyhub-mongodb

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongodb_data:/data/db

    restart: unless-stopped

volumes:
  mongodb_data:
